name: Daily Newspaper Bot

on:
  schedule:
    # Запуск каждый день в 03:00 UTC (это 08:00 по часовому поясу редакции UTC+5)
    - cron: '0 3 * * *'
  workflow_dispatch: # Кнопка "Run workflow" для ручного запуска в интерфейсе GitHub

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Установка системных библиотек и шрифтов Liberation для правильной газетной типографики
      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libffi-dev libgdk-pixbuf2.0-0 shared-mime-info fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Получаем текущую дату по часовому поясу редакции (UTC+5) для точного совпадения с cache.py
      - name: Get current date (UTC+5)
        id: date
        run: echo "date=$(TZ='Etc/GMT-5' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Восстанавливаем дневной кэш
      - name: Restore daily cache
        uses: actions/cache/restore@v4
        with:
          path: newspaper_cache.json
          key: newspaper-cache-${{ steps.date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            newspaper-cache-${{ steps.date.outputs.date }}-

      # Запуск пайплайна с секретами
      - name: Run newspaper pipeline
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python pipeline.py

      # Сохраняем готовый PDF в артефакты запуска GitHub Actions (можно скачать в интерфейсе)
      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-${{ steps.date.outputs.date }}
          path: newspaper.pdf
          if-no-files-found: ignore

      # Сохраняем кэш даже при ошибке, чтобы не парсить каналы и не тратить токены повторно
      - name: Save daily cache
        if: always()
        run: |
          # Создаем пустой файл кэша, если скрипт упал до его создания (предотвращает сбой шага cache)
          touch newspaper_cache.json
        
      - name: Cache persistence
        if: always()
        uses: actions/cache/save@v4
        with:
          path: newspaper_cache.json
          key: newspaper-cache-${{ steps.date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
