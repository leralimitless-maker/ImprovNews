name: Daily Newspaper Bot

on:
  schedule:
    # Запуск каждый день в 03:00 UTC (это 08:00 по UTC+5 — часовому поясу из config.py)
    - cron: '0 3 * * *'
  workflow_dispatch: # Добавляет кнопку "Run workflow" для ручного запуска в интерфейсе GitHub

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Установка системных библиотек, без которых WeasyPrint не сможет собрать PDF
      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libffi-dev libgdk-pixbuf2.0-0 shared-mime-info

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Получаем текущую дату для ключа кэша
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Восстанавливаем кэш. Благодаря restore-keys, при перезапуске упавшего джоба 
      # (например, если упал Telegram) подтянется самый свежий кэш за сегодня
      - name: Restore daily cache
        uses: actions/cache/restore@v4
        with:
          path: newspaper_cache.json
          key: newspaper-cache-${{ steps.date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            newspaper-cache-${{ steps.date.outputs.date }}-

      # Запуск пайплайна с передачей секретов из GitHub
      - name: Run newspaper pipeline
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python pipeline.py

      # Сохраняем кэш ДАЖЕ если скрипт упал с ошибкой. Это гарантирует, 
      # что при повторном запуске бот не будет заново парсить новости или дергать Gemini.
      - name: Save daily cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: newspaper_cache.json
          key: newspaper-cache-${{ steps.date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
